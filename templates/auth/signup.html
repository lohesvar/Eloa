{% extends 'base.html' %}

{% block title %}Create Account | Eloa{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Your Eloa Notebook</h2>
      <p>Start organizing goals, daily habits & tracking performance</p>
    </div>

    <form action="{{ url_for('signup') }}" method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="username">Username *</label>
        <input type="text" id="username" name="username" class="form-input" value="{{ username or '' }}" placeholder="Choose a unique username (min 3 chars)" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password *</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Min 6 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password *</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem;">
        Initialize My Eloa Notebook
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
    </div>
  </div>
</div>
{% endblock %}
